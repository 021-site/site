<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | موسو</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body class="admin-body">
<div id="loginBox" class="login-box">
<h2>🔐 ورود مدیر موسو</h2><p>رمز پیش‌فرض: 1234</p>
<input id="passInput" type="password" placeholder="رمز عبور">
<button onclick="login()" class="btn-primary full">ورود</button>
<a href="index.html" class="back">← بازگشت به سایت</a>
</div>
<div id="panel" class="container admin-panel" style="display:none">
<h1>⚙️ پنل مدیریت موسو</h1>
<p class="hint">تغییرات رو بده، بعد «دانلود data.json» رو بزن و فقط همین یک فایل رو در گیت‌هاب جایگزین کن.</p>
<h3>۱. مشخصات سایت</h3>
<div class="admin-grid">
<label>نام سایت<input id="f_name"></label>
<label>تیتر هیرو<input id="f_heroTitle"></label>
<label>زیرتیتر هیرو<input id="f_heroSub"></label>
<label>تلفن<input id="f_phone"></label>
<label>آدرس<input id="f_addr"></label>
<label>اینستاگرام<input id="f_insta"></label>
<label>متن درباره کوتاه<textarea id="f_about" rows="2"></textarea></label>
</div>
<h3>۲. محصولات <button onclick="addProduct()" class="btn-ghost small">+ افزودن محصول</button></h3>
<div id="prodEditor"></div>
<h3>۳. خروجی JSON</h3>
<div class="json-actions">
<button onclick="downloadJson()" class="btn-primary">⬇ دانلود data.json جدید</button>
<button onclick="copyJson()" class="btn-ghost">کپی JSON</button>
<a href="index.html" class="btn-ghost">پیش‌نمایش سایت</a>
</div>
<textarea id="jsonOut" rows="12" class="json-out" dir="ltr"></textarea>
</div>
<script>
let DATA=null;
function login(){ if(document.getElementById('passInput').value==='1234'){ document.getElementById('loginBox').style.display='none'; document.getElementById('panel').style.display='block'; load(); } else alert('رمز اشتباه است!'); }
async function load(){ const r=await fetch('data.json'); DATA=await r.json();
f_name.value=DATA.site.name; f_heroTitle.value=DATA.hero.title; f_heroSub.value=DATA.hero.subtitle;
f_phone.value=DATA.site.phone; f_addr.value=DATA.site.address; f_insta.value=DATA.site.instagram; f_about.value=DATA.site.aboutShort;
renderProds(); syncOut(); ['f_name','f_heroTitle','f_heroSub','f_phone','f_addr','f_insta','f_about'].forEach(id=>document.getElementById(id).oninput=syncOut);
}
function renderProds(){ const box=document.getElementById('prodEditor'); box.innerHTML=''; DATA.products.forEach((p,i)=>{ const d=document.createElement('div'); d.className='p-edit'; d.innerHTML=`<img src="${p.img}"><div class="p-inputs"><input value="${p.name}" oninput="DATA.products[${i}].name=this.value;syncOut()" placeholder="نام"><div class="row"><input value="${p.price}" type="number" oninput="DATA.products[${i}].price=+this.value;syncOut()" placeholder="قیمت"><input value="${p.oldPrice||''}" type="number" oninput="DATA.products[${i}].oldPrice=+this.value;syncOut()" placeholder="قیمت قبل"><input value="${p.cat||''}" oninput="DATA.products[${i}].cat=this.value;syncOut()" placeholder="دسته"></div><input value="${p.img}" dir="ltr" oninput="DATA.products[${i}].img=this.value;syncOut()" placeholder="لینک عکس"><div class="row"><input value="${p.badge||''}" oninput="DATA.products[${i}].badge=this.value;syncOut()" placeholder="برچسب"><button onclick="DATA.products.splice(${i},1);renderProds();syncOut()" class="del">حذف ✕</button></div></div>`; box.appendChild(d); }); }
function addProduct(){ DATA.products.push({id:Date.now(),name:'محصول جدید',price:990000,oldPrice:0,cat:'عمومی',img:'https://picsum.photos/seed/'+Date.now()+'/600/600',desc:'',badge:'جدید'}); renderProds(); syncOut(); }
function collect(){ DATA.site.name=f_name.value; DATA.hero.title=f_heroTitle.value; DATA.hero.subtitle=f_heroSub.value; DATA.site.phone=f_phone.value; DATA.site.address=f_addr.value; DATA.site.instagram=f_insta.value; DATA.site.aboutShort=f_about.value; return DATA; }
function syncOut(){ const d=collect(); document.getElementById('jsonOut').value=JSON.stringify(d,null,2); }
function downloadJson(){ const blob=new Blob([document.getElementById('jsonOut').value],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='data.json'; a.click(); alert('حالا این فایل را در گیت‌هاب جایگزین کن!'); }
function copyJson(){ navigator.clipboard.writeText(document.getElementById('jsonOut').value); alert('کپی شد!'); }
</script>
</body>
</html>
